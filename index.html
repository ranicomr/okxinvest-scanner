<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKX Invest · Ler QR PIX</title>
<!-- Mini App do @okxinvest_bot (12/10/2026). Página estática, sem segredo, sem dado guardado.
     Abre o leitor de QR NATIVO do Telegram (showScanQrPopup); aceita só QR PIX (BR Code, começa por 000201)
     e devolve o texto ao bot por sendData — o bot confere de novo antes de qualquer coisa. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 20px; font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #222); }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p  { margin: 0 0 18px; color: var(--tg-theme-hint-color, #777); }
  button { width: 100%; padding: 15px; border: 0; border-radius: 10px; font-size: 17px; font-weight: 600;
           background: var(--tg-theme-button-color, #2E9C74); color: var(--tg-theme-button-text-color, #fff); }
  #msg { margin-top: 16px; min-height: 1.5em; }
  .erro { color: #C0392B; }
</style>
</head>
<body>
  <h1>📷 Ler QR PIX</h1>
  <p>Aponte a câmera para o QR do PIX. O código volta para o bot, que mostra o recebedor e o valor antes de pagar.</p>
  <button id="ler" type="button">Abrir o leitor de QR</button>
  <div id="msg"></div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const msg = document.getElementById("msg");
  const aviso = (t, erro) => { msg.textContent = t; msg.className = erro ? "erro" : ""; };
  const ehPix = t => typeof t === "string" && t.trim().startsWith("000201") && t.trim().length >= 50 && t.length < 600;

  function abrir() {
    if (!tg || !tg.showScanQrPopup || !tg.isVersionAtLeast || !tg.isVersionAtLeast("6.4")) {
      aviso("Este Telegram não tem o leitor de QR (ele só existe no app do celular). Mande a foto do QR ao bot.", true);
      return;
    }
    aviso("");
    tg.showScanQrPopup({ text: "Aponte para o QR do PIX" });
  }

  if (tg) {
    tg.ready();
    tg.expand();
    tg.onEvent("qrTextReceived", ev => {
      const t = (ev && ev.data || "").trim();
      if (ehPix(t)) {
        tg.closeScanQrPopup();
        tg.sendData(t);             // fecha a Mini App; o bot recebe como web_app_data
        return true;
      }
      aviso("Esse QR não é de PIX. Tente outro.", true);   // o leitor continua aberto
    });
    tg.onEvent("scanQrPopupClosed", () => { if (!msg.textContent) aviso("Leitor fechado. Toque no botão para abrir de novo."); });
    document.getElementById("ler").addEventListener("click", abrir);
    abrir();                        // abre sozinho ao entrar
  } else {
    aviso("Abra esta página pelo botão 📷 do @okxinvest_bot.", true);
  }
</script>
</body>
</html>
